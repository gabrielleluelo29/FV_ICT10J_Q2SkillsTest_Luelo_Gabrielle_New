<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
      <style>

    body {
        display: flex;
        align-items: center;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
    }

    h1 {
        font-style: italic;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

    .menu {
        text-align: middle;
    }
   
    form {
        background-color: #abc7bf;
        width: 500px;
        padding: 35px 45px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(189, 184, 178, 0.18);
    }

    label {
        font-size: 24px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        color: #ffe6d5;
    }

    input {
        accent-color: #8B6848;
    }

    button {
        background-color: #55887e;
        color: rgb(61, 112, 107);
        border: none;
        border-radius: 20px;
        padding: 10px 25px;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(80, 60, 40, 0.18);
    }
    </style>
</head>
<body>
                      <div class="container">
        <div class="row justified-content-center">
             <div class="col-lg-5">
                 <form>
                    <label for="elements">Science Periodic Table of Elements Finder (Non-metals)</label>
                    <br>
                    <input type="text" id="elements" class="form-control">
                    <br>
                    <button type="button" class="btn btn-warning" py-click="check_element">Check element</button>
                 </form>
             </div>
        </div>
    </div>
    <div id="output1"></div>
    <script type="py" src="main.py"></script>
</body>
</html>
